name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          api-gateway:
            - 'services/api-gateway/**'
          user-service:
            - 'services/user-service/**'
          video-service:
            - 'services/video-service/**'
          comment-service:
            - 'services/comment-service/**'
          history-service:
            - 'services/history-service/**'
          notification-service:
            - 'services/notification-service/**'
          frontend:
            - 'frontend/**'

  services-ci:
    name: ${{ matrix.service }}
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.3'
        cache: false

    - name: Cache Go modules and build cache
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ matrix.service }}-${{ hashFiles(format('services/{0}/go.sum', matrix.service)) }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.service }}-

    - name: Download dependencies
      working-directory: ./services/${{ matrix.service }}
      run: go mod download

    - name: Test
      working-directory: ./services/${{ matrix.service }}
      run: go test -v -race -coverprofile=coverage.out ./... || echo "No tests found"

    - name: Build
      working-directory: ./services/${{ matrix.service }}
      run: go build -v ./cmd/server/...

    - name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        files: ./services/${{ matrix.service }}/coverage.out
        flags: ${{ matrix.service }}

  frontend-ci:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run lint
      working-directory: ./frontend
      run: npm run lint || echo "No lint script configured"

    - name: Build
      working-directory: ./frontend
      run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [services-ci, frontend-ci]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build all services
      uses: docker/bake-action@v5
      with:
        files: docker-compose.yml
        set: |
          *.cache-from=type=gha
          *.cache-to=type=gha,mode=max
      env:
        POSTGRES_PASSWORD: ci_password
